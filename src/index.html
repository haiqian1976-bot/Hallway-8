<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hallway 8</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game">
    <div id="hallway">
      <div id="ceiling-light"></div>
      <div id="poster">GO COUGARS</div>
      <div id="clock">10:08 PM</div>
      <div id="locker">LOCKER</div>
      <div id="exit-sign">EXIT</div>
      <div id="message">Hallway 0 / 8</div>
    </div>

    <div id="controls">
      <button onclick="goForward()">Walk Forward</button>
      <button onclick="turnBack()">Turn Back</button>
    </div>

    <div id="log"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
